global:
  scrape_interval: 15s  # Fast scraping for development
  evaluation_interval: 15s

# Self-monitoring configuration
scrape_configs:
  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitor other platform services
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']  # Jaeger metrics endpoint

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

# Enable remote write receiver for customer data
remote_write:
  - url: "http://localhost:9090/api/v1/write"
    name: "self"